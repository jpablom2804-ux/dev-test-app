# ==================================================
# SERVIDOR NGINX
# ==================================================
#
# Este bloque define cómo se comportará Nginx
# dentro del contenedor del Frontend.
#
# Nginx tiene dos responsabilidades principales:
#
# 1. Servir los archivos compilados de React.
# 2. Actuar como reverse proxy hacia el Backend
#    cuando la URL comienza con /api/.
#
server {


    # ==================================================
    # PUERTO
    # ==================================================
    #
    # Nginx escucha dentro del contenedor
    # en el puerto 80.
    #
    # Docker Compose publica:
    #
    # 8080:80
    #
    # Por eso desde el navegador entramos por:
    #
    # http://127.0.0.1:8080
    #
    listen 80;


    # ==================================================
    # NOMBRE DEL SERVIDOR
    # ==================================================
    #
    # "_" funciona como configuración genérica.
    #
    # Significa que este bloque puede responder
    # aunque no tengamos un dominio específico
    # configurado.
    #
    server_name _;


    # ==================================================
    # ARCHIVOS DEL FRONTEND
    # ==================================================
    #
    # Esta es la carpeta donde copiamos
    # el resultado de:
    #
    # npm run build
    #
    # desde el Dockerfile del Frontend.
    #
    root /usr/share/nginx/html;


    # Archivo principal que Nginx intentará cargar.
    index index.html;


    # ==================================================
    # RUTAS DEL FRONTEND
    # ==================================================
    #
    # Esta ubicación maneja las rutas normales
    # de la aplicación React.
    #
    location / {


        # try_files intenta encontrar primero:
        #
        # 1. un archivo real;
        # 2. un directorio real.
        #
        # Si no existe, devuelve index.html.
        #
        # Esto es importante porque React Router
        # maneja rutas como:
        #
        # /
        # /products
        # /sales
        #
        # Esas rutas no existen como archivos físicos
        # dentro de Nginx.
        #
        # Sin /index.html como respaldo:
        #
        # /products
        #
        # podría devolver 404 si el usuario
        # actualiza directamente el navegador.
        #
        try_files $uri $uri/ /index.html;
    }


    # ==================================================
    # REVERSE PROXY HACIA EL BACKEND
    # ==================================================
    #
    # Todas las solicitudes que comiencen por:
    #
    # /api/
    #
    # no son manejadas por React.
    #
    # Nginx las envía hacia el contenedor Backend.
    #
    # Ejemplo:
    #
    # Navegador:
    #
    # POST /api/auth/login
    #
    # ↓
    #
    # Nginx
    #
    # ↓
    #
    # http://backend:3000/api/auth/login
    #
    location /api/ {


        # ==================================================
        # DIRECCIÓN DEL BACKEND
        # ==================================================
        #
        # "backend" es el nombre del servicio
        # definido en Docker Compose.
        #
        # Docker permite resolver ese nombre
        # dentro de su red interna.
        #
        # Por eso no utilizamos localhost.
        #
        proxy_pass http://backend:3000;


        # ==================================================
        # VERSIÓN HTTP
        # ==================================================
        #
        # Utilizamos HTTP/1.1 para la comunicación
        # entre Nginx y el Backend.
        #
        proxy_http_version 1.1;


        # ==================================================
        # HEADERS DEL PROXY
        # ==================================================


        # Envía al Backend el Host original
        # utilizado por el cliente.
        proxy_set_header Host $host;


        # Envía la dirección IP del cliente
        # que realizó la solicitud.
        #
        # Express puede utilizar esta información.
        proxy_set_header X-Real-IP $remote_addr;


        # Mantiene una lista de las IPs
        # por las que ha pasado la petición.
        #
        # Esto es especialmente útil porque
        # nuestro Backend utiliza:
        #
        # app.set("trust proxy", 1)
        #
        # y también tenemos Rate Limiting.
        #
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}